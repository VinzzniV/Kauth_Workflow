# docker-compose.prod.yml
# Production override — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Key differences from dev/demo:
# - ASPNETCORE_ENVIRONMENT=Production → demo auth endpoints and resolvers are completely disabled
# - DEMO_ENDPOINTS_ENABLED=false → explicit redundant safeguard
# - Entra auth must be configured via ENTRA_* env vars
# - No demo seed data should be loaded in production

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DEMO_ENDPOINTS_ENABLED: "false"
      ENTRA_AUTH_ENABLED: "true"
      # Set these from your deployment environment:
      ENTRA_TENANT_ID: "81b7e1db-3ae2-4bb9-a852-4a5827fa129e"
      ENTRA_CLIENT_ID: "acc6ec31-22c4-4ebc-aa2f-676b5a81b71f"
      ENTRA_AUDIENCE: "api://acc6ec31-22c4-4ebc-aa2f-676b5a81b71f"
      DIRECTORY_GROUP_PREFIX: ""
      # ENTRA_CLIENT_SECRET: "<your-client-secret>"

  web:
    build:
      args:
        VITE_AUTH_MODE: entra
        VITE_ENTRA_CLIENT_ID: "acc6ec31-22c4-4ebc-aa2f-676b5a81b71f"
        VITE_ENTRA_TENANT_ID: "81b7e1db-3ae2-4bb9-a852-4a5827fa129e"
        VITE_ENTRA_REDIRECT_URI: "http://localhost:5173/login"
