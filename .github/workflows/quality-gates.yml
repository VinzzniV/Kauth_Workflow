name: Quality Gates

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Build And Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
        ports:
          - 25432:5432
        options: >-
          --health-cmd="pg_isready -U app -d appdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Wait For PostgreSQL
        env:
          PGPASSWORD: app_pw
        run: |
          until pg_isready -h localhost -p 25432 -U app -d appdb; do
            sleep 1
          done

      - name: Initialize Test Database
        env:
          PGPASSWORD: app_pw
        run: |
          $scripts = @(
            "db/01_schema.sql",
            "db/02_dev_seed.sql"
          )

          foreach ($script in $scripts) {
            psql -h localhost -p 25432 -U app -d appdb -v ON_ERROR_STOP=1 -f $script
          }
        shell: pwsh

      - name: Restore
        run: dotnet restore api/API.Tests/API.Tests.csproj

      - name: Build API
        run: dotnet build api/API/API.csproj -c Release --no-restore

      - name: Test API
        env:
          ONBOARDING_TEST_CONNECTION_STRING: Host=localhost;Port=25432;Database=appdb;Username=app;Password=app_pw
        run: dotnet test api/API.Tests/API.Tests.csproj -c Release --no-restore

  frontend:
    name: Frontend Lint Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
