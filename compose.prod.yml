services:
  db:
    restart: unless-stopped
    volumes:
      - ./db/init/prod:/docker-entrypoint-initdb.d:ro
      - ./db:/docker-entrypoint-sql:ro

  api:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AUTH_MODE: entra
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL}
      NotificationEmail__FrontendBaseUrl: ${PUBLIC_BASE_URL}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      DIRECTORY_GROUP_PREFIX: ${DIRECTORY_GROUP_PREFIX:-}
      DIRECTORY_EXPLICIT_GROUP_IDS: ${DIRECTORY_EXPLICIT_GROUP_IDS:-}
      DIRECTORY_SYNC_SCHEDULED: ${DIRECTORY_SYNC_SCHEDULED:-true}
      DIRECTORY_SYNC_INTERVAL_MINUTES: ${DIRECTORY_SYNC_INTERVAL_MINUTES:-15}
      HOST_RUNTIME_HEALTH_ENABLED: ${HOST_RUNTIME_HEALTH_ENABLED:-false}
      HOST_RUNTIME_PROCFS_PATH: ${HOST_RUNTIME_PROCFS_PATH:-/host-proc}
      HOST_RUNTIME_ROOT_PATH: ${HOST_RUNTIME_ROOT_PATH:-/host-root}
    volumes:
      - /proc:/host-proc:ro
      - /:/host-root:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    restart: unless-stopped
    environment:
      API_BASE: /api
      AUTH_MODE: entra
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE}
      ENTRA_REDIRECT_URI: ${PUBLIC_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_HTTP_PORT:-80}:80"
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/__proxy-health/health/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
